/* ── GITHUB CONFIG ─────────────────────────────────── */
const GH_OWNER = 'edgarprogest-create';
const GH_REPO  = 'By-Edgar-signature';
const GH_PATH  = 'images';

/* ── IMAGE STORE ───────────────────────────────────── */
let _imgs = {}, _listeners = [];
function getImgs() { return _imgs; }
function setImg(key, url) { _imgs = {..._imgs, [key]: url}; _listeners.forEach(f => f(_imgs)); }
function subImgs(fn) { _listeners.push(fn); return () => { _listeners = _listeners.filter(f => f !== fn); }; }
async function loadImgs() {
  const keys = ['eden','silva','bravo','quinta','serro','levante'];
  await Promise.all(keys.map(async key => {
    for (const ext of ['jpg','jpeg','png','webp']) {
      const url = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/main/${GH_PATH}/${key}.${ext}`;
      try { const r = await fetch(url, {method:'HEAD'}); if (r.ok) { setImg(key, url+'?t='+Date.now()); break; } } catch(e) {}
    }
  }));
}

/* ── PROJECT IMAGE ─────────────────────────────────── */
function ProjectImg({ imgKey, colors, idx=0, style={} }) {
  const [imgs, setImgs] = useState(getImgs());
  useEffect(() => subImgs(i => setImgs({...i})), []);
  const url = imgs[imgKey];
  if (url) return <img src={url} alt={imgKey} style={{ width:'100%', height:'100%', objectFit:'cover', display:'block', ...style }} />;
  const w=400, h=300;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width:'100%', height:'100%', display:'block' }}>
      <defs>
        <linearGradient id={`g${idx}`} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={colors[0]}/><stop offset="100%" stopColor={colors[1]}/>
        </linearGradient>
      </defs>
      <rect width={w} height={h} fill={`url(#g${idx})`}/>
      <rect x="50" y="100" width="60" height="200" fill="rgba(255,255,255,0.1)" rx="2"/>
      <rect x="120" y="60" width="100" height="240" fill="rgba(255,255,255,0.08)" rx="2"/>
      <rect x="230" y="80" width="70" height="220" fill="rgba(255,255,255,0.07)" rx="2"/>
      <rect x="310" y="120" width="50" height="180" fill="rgba(255,255,255,0.09)" rx="2"/>
      {[0,1,2].map(r=>[0,1].map(c=><rect key={`${r}-${c}`} x={130+c*30} y={75+r*40} width={20} height={24} fill="rgba(255,255,255,0.18)" rx="1"/>))}
      <rect x="0" y="270" width={w} height="30" fill="rgba(0,0,0,0.06)"/>
      <ellipse cx="45" cy="268" rx="28" ry="16" fill="rgba(70,110,60,0.22)"/>
      <ellipse cx="360" cy="270" rx="20" ry="12" fill="rgba(70,110,60,0.18)"/>
    </svg>
  );
}

  }

    <div style={{ display:"flex", flexDirection:"column", height:"100%", background:C.bg }}>
      {/* Hero */}

/* ── APP ───────────────────────────────────────────── */
function App() {
  const [tab, setTab] = useState("home");
  const [detail, setDetail] = useState(null);
  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%" }}>
      <div style={{ flex:1, overflow:"hidden", display:"flex", flexDirection:"column" }}>
        {detail
          ? <DetailScreen project={detail} onBack={() => setDetail(null)} />
          : tab === "home"
            ? <HomeScreen onSelect={p => setDetail(p)} />
            : <CalcScreen />
        }
      </div>
      {!detail && <BottomNav tab={tab} setTab={setTab} />}
    </div>
  );
}
