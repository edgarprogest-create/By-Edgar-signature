const { useState, useEffect } = React;

/* ── GITHUB CONFIG ─────────────────────────────────── */
const GH_OWNER = 'edgarprogest-create';
const GH_REPO  = 'By-Edgar-signature';
const GH_PATH  = 'images';

/* ── IMAGE STORE ───────────────────────────────────── */
let _imgs = {}, _listeners = [];
function getImgs() { return _imgs; }
function setImg(key, url) { _imgs = {..._imgs, [key]: url}; _listeners.forEach(f => f(_imgs)); }
function subImgs(fn) { _listeners.push(fn); return () => { _listeners = _listeners.filter(f => f !== fn); }; }
async function loadImgs() {
  const keys = ['eden','silva','bravo','quinta','serro','levante'];
  await Promise.all(keys.map(async key => {
    for (const ext of ['jpg','jpeg','png','webp']) {
      const url = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/main/${GH_PATH}/${key}.${ext}`;
      try { const r = await fetch(url, {method:'HEAD'}); if (r.ok) { setImg(key, url+'?t='+Date.now()); break; } } catch(e) {}
    }
  }));
}

/* ── PROJECT IMAGE ─────────────────────────────────── */
function ProjectImg({ imgKey, colors, idx=0 }) {
  const [imgs, setImgs] = useState(getImgs());
  useEffect(() => subImgs(i => setImgs({...i})), []);
  const url = imgs[imgKey];
  if (url) return <img src={url} alt={imgKey} style={{ width:'100%', height:'100%', objectFit:'cover', display:'block' }} />;
  const w=400, h=260;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width:'100%', height:'100%', display:'block' }}>
      <defs><linearGradient id={`g${idx}`} x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor={colors[0]}/><stop offset="100%" stopColor={colors[1]}/></linearGradient></defs>
      <rect width={w} height={h} fill={`url(#g${idx})`}/>
      <rect x="60" y="120" width="50" height="140" fill="rgba(255,255,255,0.12)" rx="2"/>
      <rect x="120" y="80" width="80" height="180" fill="rgba(255,255,255,0.10)" rx="2"/>
      <rect x="210" y="100" width="60" height="160" fill="rgba(255,255,255,0.08)" rx="2"/>
      <rect x="280" y="140" width="40" height="120" fill="rgba(255,255,255,0.10)" rx="2"/>
      {[0,1,2].map(r=>[0,1].map(c=><rect key={`${r}-${c}`} x={130+c*28} y={95+r*36} width={18} height={22} fill="rgba(255,255,255,0.22)" rx="1"/>))}
      <ellipse cx="55" cy="235" rx="30" ry="18" fill="rgba(80,120,70,0.25)"/>
      <ellipse cx="350" cy="238" rx="22" ry="14" fill="rgba(80,120,70,0.2)"/>
    </svg>
  );
}

}

/* ── CALCULATOR ────────────────────────────────────── */
function CalcScreen() {
  const [tipo, setTipo] = useState("LSF");
  const [area, setArea] = useState(80);
  const [acab, setAcab] = useState("Standard");
  const [infoOpen, setInfoOpen] = useState(false);

    { key:"LSF",     label:"Estrutura de Aço Leve (LSF)", min:1100, max:1600 },
    { key:"Madeira", label:"Estrutura de Madeira",        min:1200, max:2000 },
    { key:"CLT",     label:"Madeira Laminada (CLT)",      min:1300, max:2500 },
  ];
  const mult = { Standard:1, Premium:1.2, Luxo:1.5 };
  const tipoData = TIPOS_CONST.find(t => t.key === tipo);
  const estMin = Math.round(area * tipoData.min * mult[acab] / 1000) * 1000;
  const estMax = Math.round(area * tipoData.max * mult[acab] / 1000) * 1000;
  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%", background:C.bg }}>

      </div>
      <div style={{ flex:1, overflowY:"auto", padding:"20px 20px 24px", display:"flex", flexDirection:"column", gap:22 }}>
        <div>
          <div style={{ fontSize:9, color:C.light, letterSpacing:"2px", textTransform:"uppercase", marginBottom:10 }}>Tipo de Construção</div>
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {TIPOS_CONST.map(t => (
              <button key={t.key} onClick={() => setTipo(t.key)} style={{ padding:"12px 14px", borderRadius:10, border:`0.5px solid ${tipo===t.key?C.dark:C.border}`, background:tipo===t.key?C.dark:C.bg, textAlign:"left", cursor:"pointer", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <span style={{ fontSize:12, color:tipo===t.key?"#fff":C.dark, fontWeight:300 }}>{t.label}</span>
                <span style={{ fontSize:10, color:tipo===t.key?"rgba(255,255,255,0.6)":C.light, fontWeight:300, marginLeft:8 }}>{t.min.toLocaleString("pt-PT")} – {t.max.toLocaleString("pt-PT")} €/m²</span>
              </button>
            ))}
          </div>
        </div>
        <div>
          <div style={{ display:"flex", justifyContent:"space-between", marginBottom:10 }}>
            <div style={{ fontSize:9, color:C.light, letterSpacing:"2px", textTransform:"uppercase" }}>Área</div>
            <div style={{ fontSize:14, color:C.dark, fontWeight:400 }}>{area} m²</div>
          </div>
          <input type="range" min="40" max="250" step="5" value={area} onChange={e => setArea(+e.target.value)} />
          <div style={{ display:"flex", justifyContent:"space-between", marginTop:4 }}>
            <span style={{ fontSize:9, color:C.light }}>40 m²</span>
            <span style={{ fontSize:9, color:C.light }}>250 m²</span>
          </div>
        </div>
        <div>
          <div style={{ fontSize:9, color:C.light, letterSpacing:"2px", textTransform:"uppercase", marginBottom:10 }}>Nível de Acabamentos</div>
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {[{key:"Standard",desc:"Materiais de qualidade, funcionais e duráveis"},{key:"Premium",desc:"Caixilharia de alto desempenho, isolamento A+"},{key:"Luxo",desc:"Domótica, materiais nobres, personalização total"}].map(a => (
              <button key={a.key} onClick={() => setAcab(a.key)} style={{ padding:"12px 14px", borderRadius:12, border:`0.5px solid ${acab===a.key?C.dark:C.border}`, background:acab===a.key?C.dark:C.bg, textAlign:"left", cursor:"pointer" }}>
                <div style={{ fontSize:12, color:acab===a.key?"#fff":C.dark, fontWeight:400, marginBottom:3 }}>{a.key}</div>
                <div style={{ fontSize:10, color:acab===a.key?"rgba(255,255,255,0.6)":C.light, fontWeight:300 }}>{a.desc}</div>
              </button>
            ))}
          </div>
        </div>
        <div style={{ borderRadius:14, border:`0.5px solid ${C.border}`, overflow:"hidden" }}>
          <button onClick={() => setInfoOpen(o=>!o)} style={{ width:"100%", display:"flex", alignItems:"center", justifyContent:"space-between", padding:"12px 14px", background:"none", border:"none", cursor:"pointer" }}>
            <span style={{ fontSize:10, color:C.mid, letterSpacing:"1px", textTransform:"uppercase", fontWeight:300 }}>Referência de Preços por m² + IVA</span>
            <svg width="12" height="12" fill="none" stroke={C.light} strokeWidth="1.5" viewBox="0 0 24 24" style={{ transform:infoOpen?"rotate(180deg)":"none", transition:"transform 0.2s", flexShrink:0 }}><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          {infoOpen && <div style={{ borderTop:`0.5px solid ${C.border}` }}>
            {[{label:"Estrutura de Aço Leve (LSF)",range:"1.100 – 1.600 €/m²"},{label:"Estrutura de Madeira",range:"1.200 – 2.000 €/m²"},{label:"Madeira Laminada (CLT)",range:"1.200 – 2.500 €/m²"}].map((row,i,arr) => (
              <div key={row.label} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 14px", borderBottom:i<arr.length-1?`0.5px solid ${C.border}`:"none", background:C.surface }}>
                <span style={{ fontSize:11, color:C.mid, fontWeight:300 }}>{row.label}</span>
                <span style={{ fontSize:11, color:C.dark, fontWeight:400, flexShrink:0, marginLeft:12 }}>{row.range}</span>
              </div>
            ))}
          </div>}
        </div>
        <div style={{ background:C.surface, borderRadius:16, padding:"20px", border:`0.5px solid ${C.border}` }}>
          <div style={{ fontSize:9, color:C.light, letterSpacing:"2px", textTransform:"uppercase", marginBottom:8 }}>Estimativa Base</div>
          <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:28, fontWeight:300, color:C.dark }}>€{estMin.toLocaleString("pt-PT")} – €{estMax.toLocaleString("pt-PT")}</div>
          <div style={{ fontSize:10, color:C.light, marginTop:6, lineHeight:1.6, fontWeight:300 }}>{tipoData.label} · {area}m² · Acabamentos {acab}<br/>Inclui estrutura, instalações e entrega chave-na-mão.</div>
          <div style={{ marginTop:12, padding:"8px 12px", background:C.tag_orange, borderRadius:8 }}>
            <div style={{ fontSize:9, color:C.tag_orange_t, lineHeight:1.6, fontWeight:300 }}>⚠ Valor indicativo. Orçamento final depende do terreno, localização e personalizações.</div>
          </div>
          <button onClick={() => {
            const msg = `Olá Edgar! Fiz uma simulação:%0A%0A🏗 ${tipoData.label}%0A📐 ${area} m²%0A✨ ${acab}%0A💶 €${estMin.toLocaleString("pt-PT")} – €${estMax.toLocaleString("pt-PT")}%0A%0AGostaria de receber uma proposta detalhada.`;
            window.open(`https://wa.me/351913523088?text=${msg}`, "_blank");
          }} style={{ marginTop:12, width:"100%", padding:"14px", borderRadius:12, background:"#25D366", border:"none", color:"#fff", fontFamily:"'Jost',sans-serif", fontSize:11, fontWeight:300, letterSpacing:"2px", textTransform:"uppercase", cursor:"pointer" }}>
            Pedir Proposta via WhatsApp
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── BOTTOM NAV ────────────────────────────────────── */
function BottomNav({ tab, setTab }) {
  const items = [
    { key:"home", label:"Projetos", icon:<svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.5" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg> },
    { key:"calc", label:"Orçamento", icon:<svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="1.5" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="12" y2="18"/></svg> },
    { key:"wa", label:"WhatsApp", isLink:true, icon:<svg width="22" height="22" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="16" fill="#25D366"/><path d="M23.5 8.5A10.4 10.4 0 0 0 16 5.5C10.2 5.5 5.5 10.2 5.5 16c0 1.8.5 3.6 1.4 5.2L5.5 26.5l5.5-1.4A10.5 10.5 0 0 0 16 26.5c5.8 0 10.5-4.7 10.5-10.5 0-2.8-1.1-5.4-3-7.5zm-7.5 16.1a8.7 8.7 0 0 1-4.4-1.2l-.3-.2-3.2.8.9-3.1-.2-.3A8.7 8.7 0 0 1 7.3 16c0-4.8 3.9-8.7 8.7-8.7 2.3 0 4.5.9 6.1 2.5a8.6 8.6 0 0 1 2.6 6.2c0 4.8-3.9 8.6-8.7 8.6zm4.8-6.5c-.3-.1-1.6-.8-1.8-.9-.3-.1-.5-.1-.7.1-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.8-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.5-.6.2-.4v-.4l-.9-2.1c-.2-.5-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.6-.7 1.8-1.3.2-.6.2-1.2.1-1.3-.1-.1-.3-.2-.6-.3z" fill="#fff"/></svg> },
  ];
  return (
    <div style={{ display:"flex", borderTop:`0.5px solid ${C.border}`, background:C.bg, flexShrink:0, paddingBottom:"env(safe-area-inset-bottom)" }}>
      {items.map(item => item.isLink ? (
        <a key={item.key} href="https://wa.me/351913523088" target="_blank" rel="noopener noreferrer" style={{ flex:1, padding:"10px 0 8px", display:"flex", flexDirection:"column", alignItems:"center", gap:3, textDecoration:"none", color:C.light }}>
          {item.icon}
          <span style={{ fontSize:9, letterSpacing:"1px", textTransform:"uppercase", fontWeight:300, color:C.light }}>{item.label}</span>
        </a>
      ) : (
        <button key={item.key} onClick={() => setTab(item.key)} style={{ flex:1, padding:"10px 0 8px", border:"none", background:"none", cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:3, color:tab===item.key?C.dark:C.light }}>
          {item.icon}
          <span style={{ fontSize:9, letterSpacing:"1px", textTransform:"uppercase", fontWeight:300 }}>{item.label}</span>
          {tab===item.key && <div style={{ width:16, height:2, background:C.accent, borderRadius:1 }} />}
        </button>
      ))}
    </div>
  );
}

/* ── APP ───────────────────────────────────────────── */
function App() {
  const [tab, setTab] = useState("home");
  const [detail, setDetail] = useState(null);
  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100%" }}>
      <div style={{ flex:1, overflow:"hidden", display:"flex", flexDirection:"column" }}>
        {detail ? <DetailScreen project={detail} onBack={() => setDetail(null)} />
          : tab === "home" ? <HomeScreen onSelect={p => setDetail(p)} />
          : <CalcScreen />}
      </div>
      {!detail && <BottomNav tab={tab} setTab={setTab} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
