/* ── GLOBAL IMAGE STORE ────────────────────────────── */
// Maps project key -> custom image URL (loaded from GitHub)
let _customImages = {};
let _imageListeners = [];
function getCustomImages() { return _customImages; }
function setCustomImage(key, url) {
  _customImages = { ..._customImages, [key]: url };
  _imageListeners.forEach(fn => fn(_customImages));
}
function subscribeImages(fn) {
  _imageListeners.push(fn);
  return () => { _imageListeners = _imageListeners.filter(f => f !== fn); };
}

async function loadImagesFromGitHub() {
  const keys = ['eden','silva','bravo','quinta','serro','levante'];
  const exts = ['jpg','jpeg','png','webp'];
  await Promise.all(keys.map(async key => {
    for (const ext of exts) {
      const url = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/main/${GH_IMAGES_PATH}/${key}.${ext}`;
      try {
        const res = await fetch(url, { method: 'HEAD' });
        if (res.ok) { setCustomImage(key, url + '?t=' + Date.now()); break; }
      } catch(e) {}
    }
  }));
}

function DetailScreen({ project: p, onBack }) {
  const [imgIdx, setImgIdx] = useState(0);

  const [customImages, setCustomImages] = useState(getCustomImages());
  const imgs = [p.cor, [p.cor[1], p.cor[0]], ["#b8b0a4", p.cor[0]]];

  useEffect(() => {
    const unsub = subscribeImages(imgs => setCustomImages({...imgs}));
    return unsub;
  }, []);

  function handleShare() {
    const txt = `By Edgar Signature — ${p.nome} (${p.tipo})\n${p.area}m² · ${p.quartos} quartos · €${p.preco.toLocaleString("pt-PT")}\n${p.local}`;
    if (navigator.share) {
      navigator.share({ title: `${p.nome} — By Edgar Signature`, text: txt });
    } else {
      navigator.clipboard?.writeText(txt);
      setShared(true);
      setTimeout(() => setShared(false), 2000);
    }

    try {
      const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}`, {
        headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
      });
      if (res.ok) { setGhToken(token); setScreen('manage'); }
      else setLoginError('Token inválido ou sem acesso ao repositório.');
    } catch(e) { setLoginError('Erro de ligação.'); }
    setLoginLoading(false);
  }

  async function handleUpload(imgKey, projectName, file) {
    setUploading(imgKey);
    setStatus({ msg: `A fazer upload de "${file.name}"...`, type: 'info' });
    try {
      const base64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result.split(',')[1]);
        r.onerror = rej;
        r.readAsDataURL(file);
      });
      const ext = file.name.split('.').pop().toLowerCase();
      const filePath = `${GH_IMAGES_PATH}/${imgKey}.${ext}`;
      // Check for existing SHA (any extension)
      let sha = null;
      for (const e of ['jpg','jpeg','png','webp']) {
        const r = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_IMAGES_PATH}/${imgKey}.${e}`, {
          headers: { Authorization: `token ${ghToken}`, Accept: 'application/vnd.github.v3+json' }
        });
        if (r.ok) { const d = await r.json(); sha = d.sha; break; }
      }
      const uploadRes = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${filePath}`, {
        method: 'PUT',
        headers: { Authorization: `token ${ghToken}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: `foto: ${imgKey}`, content: base64, ...(sha ? { sha } : {}) })
      });
      if (uploadRes.ok) {
        const newUrl = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/main/${filePath}?t=${Date.now()}`;
        setCustomImage(imgKey, newUrl);
        setStatus({ msg: `✓ "${projectName}" atualizado!`, type: 'ok' });
        setTimeout(() => setStatus({ msg: '', type: '' }), 4000);
      } else {
        const err = await uploadRes.json();
        setStatus({ msg: `Erro: ${err.message}`, type: 'error' });
      }
    } catch(e) { setStatus({ msg: 'Erro inesperado.', type: 'error' }); }
    setUploading(null);
  }

  const S = {
    overlay: { position:'fixed', inset:0, background:'rgba(26,24,20,0.85)', zIndex:2000, display:'flex', alignItems:'flex-end', justifyContent:'center', backdropFilter:'blur(4px)' },
    panel: { background:'#fff', width:'100%', maxWidth:390, maxHeight:'88vh', overflowY:'auto', borderRadius:'16px 16px 0 0', padding:'24px 20px 32px', animation:'slideUp 0.3s ease' },
    title: { fontFamily:"'Cormorant Garamond',serif", fontWeight:300, fontSize:20, color:'#1a1a18', marginBottom:4 },
    sub: { fontSize:10, color:'#7a776f', letterSpacing:'1px', marginBottom:20 },
    input: { width:'100%', border:'0.5px solid #ede9e3', padding:'11px 13px', fontSize:12, fontFamily:"'Jost',sans-serif", fontWeight:300, outline:'none', color:'#1a1a18', marginBottom:8 },
    btn: { width:'100%', padding:'13px', background:'#1a1a18', color:'#fff', border:'none', fontSize:10, letterSpacing:'2.5px', textTransform:'uppercase', cursor:'pointer', fontFamily:"'Jost',sans-serif" },
    btnSecondary: { width:'100%', padding:'11px', background:'transparent', color:'#7a776f', border:'0.5px solid #ede9e3', fontSize:10, letterSpacing:'2px', textTransform:'uppercase', cursor:'pointer', fontFamily:"'Jost',sans-serif", marginTop:10 },
    error: { fontSize:11, color:'#c0392b', marginBottom:10 },
    hint: { fontSize:10, color:'#7a776f', lineHeight:1.6, marginBottom:14 },
    projectRow: { display:'flex', alignItems:'center', gap:12, padding:'10px 0', borderBottom:'0.5px solid #ede9e3' },
    thumb: { width:56, height:42, objectFit:'cover', flexShrink:0, background:'#ede9e3' },
    uploadBtn: { fontSize:9, letterSpacing:'1.5px', textTransform:'uppercase', background:'#8a7560', color:'#fff', border:'none', padding:'7px 11px', cursor:'pointer', flexShrink:0 },
    statusBox: (type) => ({ fontSize:11, padding:'9px 12px', background: type==='error'?'rgba(192,57,43,0.08)':type==='ok'?'rgba(61,122,74,0.08)':'rgba(200,169,110,0.1)', color: type==='error'?'#c0392b':type==='ok'?'#3d7a4a':'#8a7560', border:`0.5px solid ${type==='error'?'rgba(192,57,43,0.3)':type==='ok'?'rgba(61,122,74,0.3)':'rgba(200,169,110,0.3)'}`, marginBottom:14 }),
  };

  return (
    <div style={S.overlay} onClick={e => e.target===e.currentTarget && onClose()}>
      <style>{`@keyframes slideUp { from { transform:translateY(100%); opacity:0 } to { transform:translateY(0); opacity:1 } }`}</style>
      <div style={S.panel}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16 }}>
          <div style={S.title}>Gestão de Fotos</div>
          <button onClick={onClose} style={{ background:'none', border:'none', fontSize:18, color:'#7a776f', cursor:'pointer' }}>✕</button>
        </div>

        {screen === 'login' && (
          <>
            <p style={S.hint}>Introduz o teu GitHub Token para gerir as fotos.</p>
            <input style={S.input} type="password" placeholder="GitHub Token (ghp_...)" value={token} onChange={e=>setToken(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleLogin()} />
            <p style={S.hint}>Cria em: <strong>GitHub → Settings → Developer settings → Personal access tokens → Fine-grained → Contents (write)</strong></p>
            {loginError && <div style={S.error}>{loginError}</div>}
            <button style={S.btn} onClick={handleLogin} disabled={loginLoading}>{loginLoading ? 'A verificar...' : 'Entrar'}</button>
          </>
        )}

        {screen === 'manage' && (
          <>
            <p style={S.sub}>Clica em "Trocar" para substituir a foto de um projeto.</p>
            {status.msg && <div style={S.statusBox(status.type)}>{status.msg}</div>}
            <div>
              {PROJECTS.map(p => {
                const hasCustom = !!customImages[p.imgKey];
                return (
                  <div key={p.imgKey} style={S.projectRow}>
                    {hasCustom
                      ? <img src={customImages[p.imgKey]} alt={p.nome} style={S.thumb} />
                      : <div style={{ ...S.thumb, display:'flex', alignItems:'center', justifyContent:'center' }}>
                          <svg viewBox="0 0 56 42" width="56" height="42"><rect width="56" height="42" fill={p.cor[0]}/></svg>
                        </div>
                    }
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:15, color:'#1a1a18' }}>{p.nome}</div>
                      <div style={{ fontSize:9, color:'#7a776f', marginTop:2 }}>{hasCustom ? '✓ Foto personalizada' : 'Placeholder'}</div>
                    </div>
                    <label style={{ ...S.uploadBtn, opacity: uploading===p.imgKey ? 0.5 : 1, cursor: uploading===p.imgKey ? 'not-allowed' : 'pointer' }}>
                      {uploading===p.imgKey ? '...' : 'Trocar'}
                      <input type="file" accept="image/*" style={{ display:'none' }} disabled={!!uploading}
                        onChange={e => { const f=e.target.files[0]; if(f) handleUpload(p.imgKey, p.nome, f); e.target.value=''; }} />
                    </label>
                  </div>
                );
              })}
            </div>
            <button style={S.btnSecondary} onClick={() => { setGhToken(null); setScreen('login'); setToken(''); }}>Terminar sessão</button>
          </>
        )}
      </div>
    </div>
  );
}

/* ── APP ───────────────────────────────────────────── */
function App() {
  const [tab, setTab] = useState("home");
  const [detail, setDetail] = useState(null);
  const [adminOpen, setAdminOpen] = useState(false);
  const adminClicks = useRef(0);
  const adminTimer = useRef(null);

  function handleAdminTrigger() {
    adminClicks.current++;
    clearTimeout(adminTimer.current);
    adminTimer.current = setTimeout(() => { adminClicks.current = 0; }, 2000);
    if (adminClicks.current >= 5) { adminClicks.current = 0; setAdminOpen(true); }
  }

  function handleSelect(p) { setDetail(p); }
  function handleBack() { setDetail(null); }

  return (
    <IosFrame statusBarStyle="dark">
      <div style={{ display: "flex", flexDirection: "column", height: "100%", fontFamily: "'Jost', sans-serif" }}>
        <div style={{ flex: 1, overflow: "hidden", display: "flex", flexDirection: "column" }}>
          {detail
            ? <DetailScreen project={detail} onBack={handleBack} />
            : tab === "home"
              ? <HomeScreen onSelect={handleSelect} />
              : <CalcScreen />
          }
        </div>
        {!detail && <BottomNav tab={tab} setTab={setTab} />}
      </div>
      {/* Botão admin invisível — 5 cliques no canto inferior direito */}
      <button onClick={handleAdminTrigger} style={{ position:'absolute', bottom:40, right:0, width:44, height:44, background:'transparent', border:'none', cursor:'pointer', zIndex:100, opacity:0 }} />
      {adminOpen && <AdminPanel onClose={() => setAdminOpen(false)} />}
    </IosFrame>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
